[project]
name = "telegram-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shaxzod", email = "shrashidov8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptg>=0.6.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "mcp>=1.27.0",
    "pillow>=12.2.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "rich>=15.0.0",
    "starlette>=1.0.0",
    "telethon>=1.43.2",
    "typer>=0.25.1",
    "uvicorn>=0.46.0",
]

[project.scripts]
telegram-mcp = "telegram_mcp.cli:app"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
